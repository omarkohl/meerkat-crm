# The scheme the browser used: a TLS-terminating proxy in front of this container sets
# X-Forwarded-Proto. Only "http" and "https" are accepted, anything else (or nothing) falls
# back to the scheme that reached nginx. The value is trusted for HSTS and passed to the
# backend, nothing else: a client that spoofs it only changes its own headers.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

# HSTS only when the browser is on HTTPS (see frontend/security-headers.conf).
map $forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Health check proxy - forward to backend.
    # `^~` on the proxied prefixes stops the asset regexes further down from
    # taking precedence over them (regex locations otherwise win over prefixes).
    location ^~ /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API proxy - forward requests to backend
    location ^~ /api/ {
        client_max_body_size 26m;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # CardDAV well-known discovery
    location /.well-known/carddav {
        return 301 /carddav/;
    }

    # CardDAV proxy - forward to backend
    location ^~ /carddav/ {
        proxy_pass http://backend:8080/carddav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        
        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        
        # Support WebDAV methods
        proxy_method $request_method;
        
        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Don't buffer for streaming
        proxy_buffering off;
        
        # Ensure UTF-8 charset for vCard responses
        charset utf-8;
        charset_types text/vcard text/xml application/xml;
    }

    # SPA fallback - serve index.html for all non-file routes.
    # index.html is never cached: it names the hashed bundles, so a cached copy
    # would keep an updated instance loading the previous release's assets.
    #
    # Note: nginx does not inherit server-level add_header once a location sets its
    # own (Cache-Control here), so the security headers are an include per location.
    # Proxied locations include nothing: the backend's headers pass through as sent.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Content-hashed build output. The bundler puts a content hash in every
    # filename under /assets/, so these URLs change whenever their bytes do and
    # can be pinned in the browser cache indefinitely.
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Unhashed assets in the web root
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json|txt|webmanifest|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
