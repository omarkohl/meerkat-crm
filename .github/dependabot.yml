# Daily checks, a 7-day cooldown before a new release is proposed, one pull request per
# ecosystem for all update types (docs/adr/0015-dependency-updates.md).
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    # Major-version pins. Every entry needs the reason and the condition that removes it; delete
    # the entry when the condition holds.
    ignore:
      # Blocked by: eslint-plugin-jsx-a11y does not list ESLint 10 in its peerDependencies. Check
      # `npm view eslint-plugin-jsx-a11y peerDependencies.eslint`. The same blocker is tracked for
      # eslint-plugin-react in https://github.com/jsx-eslint/eslint-plugin-react/issues/3977; no
      # issue is known for jsx-a11y itself.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Blocked by: openapi-typescript's peer range is `^5.x`, so TypeScript 6 and 7 are refused
      # (`npm view openapi-typescript peerDependencies.typescript`); typescript-eslint's is
      # `>=4.8.4 <6.1.0`, which also refuses 7. No tracking issue is known.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Blocked by: @mui/lab has no stable release for the next MUI major (v9 only has betas), and
      # the code is not migrated: MUI 9 breaks Stack props, TextField InputProps and Snackbar
      # onClose types. No tracking issue is known.
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images in the three Dockerfiles (root, backend, frontend), pinned to a full version tag
  # so Dependabot sees every change.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  # Jekyll documentation site.
  - package-ecosystem: "bundler"
    directory: "/docs"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      bundler:
        patterns: ["*"]
