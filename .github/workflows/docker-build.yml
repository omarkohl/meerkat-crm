name: Docker build and scan

# Builds every image without pushing it and scans it with Trivy, so a broken
# Dockerfile or a fixable HIGH/CRITICAL vulnerability in a base image or package
# shows up on the pull request instead of at release time. The weekly run catches
# advisories that appear without code changes.
on:
  push:
    branches: [main, omk]
    paths:
      - "Dockerfile"
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - ".dockerignore"
      - ".trivyignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - ".dockerignore"
      - ".trivyignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

jobs:
  build-and-scan:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: All-in-one image
            context: .
            file: ./Dockerfile
          - name: Backend image
            context: ./backend
            file: ./backend/Dockerfile
          - name: Frontend image
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: meerkat-scan:latest
          # Rebuild the runtime stage on every run so apk fetches current Alpine fixes.
          no-cache-filters: runtime
          cache-from: type=gha,scope=scan-${{ matrix.file }}
          cache-to: type=gha,scope=scan-${{ matrix.file }},mode=max

      # Fails on HIGH/CRITICAL findings that have a fix available. Findings without a
      # fix are ignored (nothing to do about them yet); accepted exceptions go into
      # .trivyignore with a reason and an expiry date.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: meerkat-scan:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
