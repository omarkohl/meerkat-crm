name: Build and Push Docker Images

on:
  push:
    # Fork tags only: upstream tags mirrored to the fork must not publish.
    tags: ["v*-omk.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fork releases come from the omk branch; main only tracks upstream.
  check-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tagged commit on omk
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/omk ||
            { echo "::error::$GITHUB_REF_NAME is not on the omk branch"; exit 1; }

  create-release:
    needs: check-branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The images are tagged by docker/metadata-action's `{{version}}`, which
      # strips the leading "v" from the git tag. github.ref_name keeps it, so
      # quoting it in the release notes advertised a tag that is never pushed
      # (ghcr.io/...:v1.6.2 -> manifest unknown). Strip it here to match.
      - name: Derive image tag from git tag
        id: version
        run: echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          append_body: true
          body: |

            ## Docker Images

            All-in-one image (frontend + backend in one container):
            ```
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.image_tag }}
            ```

            Separate images:
            ```
            ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.image_tag }}
            ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.image_tag }}
            ```

  build-and-push:
    needs: check-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: ./backend
            file: ./backend/Dockerfile
            suffix: -backend
          - context: ./frontend
            file: ./frontend/Dockerfile
            suffix: -frontend
          - context: .
            file: ./Dockerfile
            suffix: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          # Rebuild the runtime stage on every run so apk fetches current Alpine fixes.
          no-cache-filters: runtime
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM and SLSA provenance to the image in the registry.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publish${{ matrix.suffix }}
          cache-to: type=gha,scope=publish${{ matrix.suffix }},mode=max
