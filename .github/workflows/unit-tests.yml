name: Unit Tests

on:
  push:
    branches: [main, omk]
  pull_request:

jobs:
  backend:
    permissions:
      contents: read
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum

      # -race needs cgo (a C compiler, present on the runner); the SQLite driver itself is pure Go.
      # -race implies atomic coverage counting.
      - name: Run tests (race detector, coverage)
        run: make test-coverage-go GO_TEST_FLAGS=-race
        env:
          # The Radicale scenarios have their own job below; off must be said explicitly on CI.
          MEERKAT_CARDDAV_IT: "off"

      - name: Summarise coverage
        if: ${{ !cancelled() && hashFiles('backend/coverage.out') != '' }}
        working-directory: backend
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "### Go coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('backend/coverage.out') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14

  # Contact sync scenarios against a real Radicale server (sync-collection REPORT,
  # deletion tombstones, multi-get), which the in-process test server cannot cover.
  # Started with `docker run` after checkout, not as a service container, because it
  # needs docker/radicale from the repository mounted as its config.
  carddav-integration:
    permissions:
      contents: read
    name: CardDAV sync (Radicale)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Start Radicale
        run: |
          docker run -d --name radicale -p 5232:5232 \
            -v "$PWD/docker/radicale:/config:ro" \
            tomsquest/docker-radicale:3.8.3.0
          timeout 60 bash -c 'until curl -fs -u testuser:testpass http://127.0.0.1:5232/ >/dev/null; do sleep 1; done'

      # The whole package, not only TestContactSync*: the other sync tests (discovery,
      # background start) also use the Radicale harness when the variable is set.
      - name: Run service tests against Radicale
        run: make test-carddav

      - name: Radicale log
        if: ${{ failure() }}
        run: docker logs radicale

  frontend:
    permissions:
      contents: read
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run tests (coverage)
        run: make test-coverage-frontend
        env:
          CI: true

      - name: Summarise coverage
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        working-directory: frontend
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; console.log('### Frontend coverage: lines '+t.lines.pct+'%, statements '+t.statements.pct+'%, branches '+t.branches.pct+'%, functions '+t.functions.pct+'%')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14
