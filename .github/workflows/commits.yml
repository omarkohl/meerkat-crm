name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  commits:
    permissions:
      contents: read
      pull-requests: read
    name: Commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The event's base_ref is stale when the PR joins a stack right after it opens.
      - name: Check the commit subjects of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          make check-commits RANGE="origin/$base..HEAD"
