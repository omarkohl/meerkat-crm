name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["docs/**"]
  # Pull requests only build the site (no deploy), so a broken Jekyll build is caught before merge.
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue (never cancelled mid-deploy); each PR has its own group so it cannot block them.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The site is upstream's (fbuchner.github.io); forks do not build or deploy it.
    if: github.repository == 'fbuchner/meerkat-crm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"
        working-directory: docs
        env:
          JEKYLL_ENV: production
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
