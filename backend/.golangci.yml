version: "2"

# Baseline: real findings are fixed; rules that are noisy on the existing code
# are excluded below with the reason, so CI starts green and stays strict for
# new code. Revisit the exclusions one at a time.

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - revive
    - bodyclose
    - sqlclosecheck
    - forbidigo
    - depguard
  settings:
    errcheck:
      exclude-functions:
        # Close/Seek/Remove on read paths and best-effort cleanup.
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*net/smtp.Client).Close
        - (io.Seeker).Seek
        - (io.ReadSeeker).Seek
        - (*bytes.Reader).Seek
        - (*os.File).Seek
        - os.Remove
        # Never returns an error since Go 1.24.
        - crypto/rand.Read
        # Builder method that returns its receiver; the result is not an error.
        - (*meerkat/errors.AppError).WithDetails
    staticcheck:
      checks:
        - all
        # Doc-comment style rules, noisy on existing code (same as the default set).
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Style-only quick fixes (De Morgan, tagged switch).
        - -QF1001
        - -QF1002
    gosec:
      excludes:
        - G101 # false positive on error code constants and similar names
        - G104 # unhandled errors are errcheck's job (with its exclusions)
        # G115, G201, G202, G301, G304 are not excluded: the known hits carry a
        # line-level //nolint:gosec with the reason, so new code is still checked.
    depguard:
      # Layering (docs/adr/0010-target-layering.md). Direct imports only; test files are
      # included so a test cannot drag the wrong layer in either.
      rules:
        models-stay-at-the-bottom:
          files:
            - "**/models/**"
          deny:
            - pkg: meerkat/controllers
              desc: models is the lowest layer; it must not know controllers (ADR 0010)
            - pkg: meerkat/services
              desc: models is the lowest layer; it must not know services (ADR 0010)
            - pkg: github.com/gin-gonic/gin
              desc: models must not depend on the HTTP framework (ADR 0010)
        services-do-not-know-http:
          files:
            - "**/services/**"
          deny:
            - pkg: meerkat/controllers
              desc: services sit below controllers (ADR 0010)
            - pkg: github.com/gin-gonic/gin
              desc: services take plain values, not *gin.Context (ADR 0010)
        # Module layout (docs/adr/0012-module-layout.md). Test files are exempt: they build
        # the module on a real database.
        contacts-domain-stays-pure:
          files:
            - "**/contacts/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
        contacts-use-cases-depend-on-ports:
          files:
            - "**/contacts/internal/app/**"
            - "!$test"
          deny:
            - pkg: gorm.io/gorm
              desc: use cases talk to ports, not to GORM; put the query in internal/adapters/persistence (ADR 0012)
            - pkg: github.com/gin-gonic/gin
              desc: use cases do not know HTTP; map in internal/adapters/http (ADR 0012)
            - pkg: github.com/danielgtaylor/huma
              desc: use cases do not know HTTP; map in internal/adapters/http (ADR 0012)
            - pkg: meerkat/models
              desc: use cases use domain types; the adapter maps from models (ADR 0012)
            - pkg: meerkat/services
              desc: use cases depend on a port, an adapter calls the service (ADR 0012)
            - pkg: meerkat/api
              desc: use cases do not know the HTTP layer (ADR 0012)
            - pkg: meerkat/contacts/internal/adapters
              desc: use cases never import adapters; adapters implement the ports (ADR 0012)
        contacts-repositories-stay-in-persistence:
          # contacts.go is the entry seam: Deps.DB is a *gorm.DB, which it hands to persistence.New.
          files:
            - "**/contacts/**"
            - "!**/contacts/internal/adapters/persistence/**"
            - "!**/contacts/contacts.go"
            - "!$test"
          deny:
            - pkg: gorm.io/gorm
              desc: only the persistence adapter talks to GORM (ADR 0012)
            - pkg: meerkat/models
              desc: only the persistence adapter knows the GORM models (ADR 0012)
        notes-domain-stays-pure:
