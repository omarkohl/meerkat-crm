        only-routes-import-controllers:
          # main.go is the composition root and may call into controllers; routes registers them.
          files:
            - "$all"
            - "!**/routes/**"
            - "!**/controllers/**"
            - "!**/backend/main.go"
          deny:
            - pkg: meerkat/controllers
              desc: only routes (and main.go) may import controllers (ADR 0010)
    forbidigo:
      # Resolve names through types, so an aliased import (tm "time") is caught too
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: >-
            Do not read the wall clock in business code: take now as a parameter (controllers:
            middleware.RequestNow(c); jobs: the scheduler passes clk.Now()). See
            docs/adr/0009-injected-clock.md.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        # Left out as noisy on existing code: exported (doc comments),
        # package-comments, unused-parameter (handler signatures),
        # var-naming (Id/Api/Url renames would change exported types).
  exclusions:
    rules:
      # Tests: unchecked errors in setup and test-only file permissions are fine.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - forbidigo
      # The places that may read the clock (docs/adr/0009-injected-clock.md): the
      # composition root, the clock itself, and middleware (request time, rate limits,
      # request durations). metrics only measures durations.
      - path: ^(main\.go|clock/|middleware/|metrics/)
        linters:
          - forbidigo
